<!DOCTYPE html>
<html

    {"id":"seriesTag","type":"string","label":"Etiqueta de serie","default":"Google Sheets + IA · Parte 2"},
    {"id":"brandColor","type":"color","label":"Color acento","default":"#6d987b"},
    {"id":"tipColor","type":"color","label":"Color tip","default":"#d8b374"}

>
<head>
  <meta charset="UTF-8" />
  <title>App del súper con Google Sheets + IA — Parte 2 (video a pantalla completa)</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 914px;
      overflow: hidden;
      background: #0d100f;
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root {
      position: relative;
      width: 1920px;
      height: 914px;
      overflow: hidden;
      background: #0d100f;
    }
    /* El video llena el lienzo completo: 1920 x 914 es la proporción real del material (1504 x 716). */
    #screen-video {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 914px;
      z-index: 1;
      object-fit: cover;
      background: #ffffff;
    }
    .scene-host {
      position: absolute;
      inset: 0;
      z-index: 25;
      pointer-events: none;
    }
    .caption-host {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
    }
    .transition-host {
      position: absolute;
      inset: 0;
      z-index: 28;
      pointer-events: none;
    }
  </style>
</head>
